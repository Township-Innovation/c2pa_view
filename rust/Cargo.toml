[package]
name = "c2pa_view"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
c2pa = { git = "https://github.com/in-reality/c2pa-rs", rev = "e88d06c807035a3285596f8646f4b9aea6c74e45", features = ["file_io", "rust_native_crypto"] }
flutter_rust_bridge = "=2.12.0"
mime_guess = "2.0.5"
serde_json = "1"

[dev-dependencies]
pollster = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
